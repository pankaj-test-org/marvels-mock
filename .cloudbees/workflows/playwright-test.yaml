apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Playwright tests - publish results
on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

jobs:
  playwright-tests:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      # Four `playwright test` invocations in one step, the shape a suite takes
      # when it needs setup and teardown around the tests it cares about.
      #
      # The JSON reporter writes to a fixed path, so sharing it across the four
      # runs would mean only the last is published. PLAYWRIGHT_JSON_OUTPUT_FILE
      # gives every invocation its own file, and publish-test-results combines
      # every report it is given and sums the totals - no merging needed here.
      #
      # The paths are absolute. Playwright resolves this variable against the
      # process working directory, whereas the config's `outputFile` resolves
      # against the config directory - so a relative value here can land
      # somewhere the publish step is not looking, while mkdir and ls in this
      # step still appear correct.
      #
      # The reports must NOT go in test-results/. That is Playwright's own
      # default outputDir, and it is emptied at the start of every run, so each
      # invocation would delete the previous report instead of adding to it.
      # Playwright also drops its .last-run.json there. Use a directory
      # Playwright does not manage.
      #
      # The fourth run greps a tag no test carries, so it collects nothing and
      # still writes a report - an empty one. With one report per run that
      # contributes zero and the other three are published as normal; sharing a
      # single report path would let it blank them all.
      - name: Run tagged Playwright suites
        kind: test
        uses: docker://mcr.microsoft.com/playwright:v1.60.0-noble
        run: |
          npm ci
          REPORTS=${{ cloudbees.workspace }}/published-reports

          mkdir -p $REPORTS

          echo "reports dir: $REPORTS"
          echo "working dir : $(pwd)"

          show() {
            node -e "
              const r = require('$REPORTS/$1.json');
              const s = r.stats || {};
              console.log('    $REPORTS/$1.json -> expected=' + s.expected + ' skipped=' + s.skipped);
            "
          }

          echo "=== run 1/4: @Login ==="
          PLAYWRIGHT_JSON_OUTPUT_FILE=$REPORTS/login.json \
            npx playwright test --grep '@Login'; show login
          echo "=== run 2/4: @cleanup ==="
          PLAYWRIGHT_JSON_OUTPUT_FILE=$REPORTS/cleanup.json \
            npx playwright test --grep '@cleanup'; show cleanup
          echo "=== run 3/4: @regression ==="
          PLAYWRIGHT_JSON_OUTPUT_FILE=$REPORTS/regression.json \
            npx playwright test --grep '@regression'; show regression

          echo "=== run 4/4: a tag that matches nothing ==="
          PLAYWRIGHT_JSON_OUTPUT_FILE=$REPORTS/no-matching-tests.json \
            npx playwright test --grep '@noMatchingTests' --pass-with-no-tests
          show no-matching-tests

          echo "--- every run kept its own report, so all of them get published ---"
          ls -lha $REPORTS/
          node -e "
            const fs = require('fs');
            const dir = '$REPORTS';
            // Skip dotfiles: Playwright writes .last-run.json, which has no stats.
            // The publish step skips them too, since *.json does not match a leading dot.
            const files = fs.readdirSync(dir).filter((f) => !f.startsWith('.') && f.endsWith('.json'));
            let total = 0;
            for (const f of files) {
              const s = require(dir + '/' + f).stats || {};
              total += s.expected || 0;
            }
            console.log('    ' + files.length + ' reports, expected across all of them = ' + total);
          "

      # A glob rather than a bare directory: a directory that does not exist
      # cannot be resolved, whereas a pattern matching nothing is reported as
      # having no results.
      - name: Publish test results
        kind: test
        uses: cloudbees-io/publish-test-results@v2
        if: ${{ always() }}
        with:
          test-type: PLAYWRIGHT
          results-path: ${{ cloudbees.workspace }}/published-reports/*.json

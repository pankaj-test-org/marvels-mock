apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CBP-45873 - Playwright results aggregated (fix)
on:
  push:
    branches:
      - "**"

jobs:
  cbp-45873-fix:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      # Same four invocations, same tests, same blank last run as
      # cbp-45873-playwright-overwrite.yaml. The only difference is where each
      # run writes its report.
      #
      # PLAYWRIGHT_JSON_OUTPUT_FILE gives every invocation its own file, so
      # nothing is overwritten. Playwright reads that variable ahead of the
      # `outputFile` set in the config, so the shared config needs no change.
      #
      # BLANK_LAST_RUN stays true, which is the case that currently publishes
      # nothing: the teardown run collects zero tests and still writes a report.
      # Aggregating means it simply contributes zero instead of blanking the
      # other three.
      #
      # No blob reporter and no `playwright merge-reports` anywhere. The publish
      # action already combines every report it is given and sums the totals.
      - name: Run tagged Playwright suites
        kind: test
        uses: docker://mcr.microsoft.com/playwright:v1.60.0-noble
        env:
          BLANK_LAST_RUN: "true"
        run: |
          npm ci
          CFG=playwright.cbp-45873.config.ts
          echo "BLANK_LAST_RUN=$BLANK_LAST_RUN"

          mkdir -p test-results

          show() {
            node -e "const s=require('./test-results/$1.json').stats;console.log('    test-results/$1.json -> expected='+s.expected+' skipped='+s.skipped)"
          }

          echo "=== run 1/4: @Login ==="
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/login.json \
            npx playwright test -c $CFG --grep '@Login'; show login
          echo "=== run 2/4: @cleanup ==="
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/cleanup.json \
            npx playwright test -c $CFG --grep '@cleanup'; show cleanup
          echo "=== run 3/4: @regression ==="
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/regression.json \
            npx playwright test -c $CFG --grep '@regression'; show regression

          echo "=== run 4/4: @teardown ==="
          if [ "$BLANK_LAST_RUN" = "true" ]; then
            echo "RUN_TEARDOWN unset -> collects nothing, writes its own empty report"
            PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/teardown.json \
              npx playwright test -c $CFG --grep '@teardown' --pass-with-no-tests
          else
            echo "RUN_TEARDOWN=true -> contributes 2 real tests"
            RUN_TEARDOWN=true PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/teardown.json \
              npx playwright test -c $CFG --grep '@teardown'
          fi
          show teardown

          echo "--- every run kept its own report, so all of them get published ---"
          ls -lh test-results/
          node -e "
            const fs = require('fs');
            const total = fs.readdirSync('test-results')
              .filter((f) => f.endsWith('.json'))
              .reduce((sum, f) => sum + require('./test-results/' + f).stats.expected, 0);
            console.log('    expected across all reports = ' + total);
          "

      # A glob rather than a bare directory: a directory that does not exist
      # cannot be resolved, whereas a pattern matching nothing is reported as
      # having no results.
      - name: Publish test results
        kind: test
        uses: cloudbees-io/publish-test-results@v2
        if: ${{ always() }}
        with:
          test-type: PLAYWRIGHT
          results-path: ${{ cloudbees.workspace }}/test-results/*.json

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CBP-45873 - Playwright results.json overwrite
on:
  push:
    branches:
      - "**"

jobs:
  cbp-45873:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      # Four `playwright test` invocations in one step, mirroring the
      # cbp-test-automation pods that run @Login and @cleanup around the main
      # suite. The JSON reporter rewrites results.json every time, so only the
      # last invocation survives to the publish step.
      #
      # BLANK_LAST_RUN=true makes that last invocation collect zero tests, so
      # results.json ends up {"suites":[],"expected":0} while the step still
      # exits 0 - a green run with an empty Test results tab. Flip it to false
      # here to turn the bug off and publish the 2 teardown tests instead.
      - name: Run tagged Playwright suites
        kind: test
        uses: docker://mcr.microsoft.com/playwright:v1.60.0-noble
        env:
          BLANK_LAST_RUN: "true"
        run: |
          npm ci
          CFG=playwright.cbp-45873.config.ts
          echo "BLANK_LAST_RUN=$BLANK_LAST_RUN"

          show() {
            node -e "const s=require('./results.json').stats;console.log('    results.json -> expected='+s.expected+' skipped='+s.skipped)"
          }

          echo "=== run 1/4: @Login ==="
          npx playwright test -c $CFG --grep '@Login'; show
          echo "=== run 2/4: @cleanup ==="
          npx playwright test -c $CFG --grep '@cleanup'; show
          echo "=== run 3/4: @regression ==="
          npx playwright test -c $CFG --grep '@regression'; show

          echo "=== run 4/4: @teardown ==="
          if [ "$BLANK_LAST_RUN" = "true" ]; then
            echo "RUN_TEARDOWN unset -> collects nothing, overwrites results.json with an empty report"
            npx playwright test -c $CFG --grep '@teardown' --pass-with-no-tests
          else
            echo "RUN_TEARDOWN=true -> contributes 2 real tests"
            RUN_TEARDOWN=true npx playwright test -c $CFG --grep '@teardown'
          fi
          show

          echo "--- 9 tests ran across the 4 invocations; the count above is all that gets published ---"

      - name: Publish test results
        kind: test
        uses: cloudbees-io/publish-test-results@v2
        if: ${{ always() }}
        with:
          test-type: PLAYWRIGHT
          results-path: ${{ cloudbees.workspace }}/results.json

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Playwright tests - publish results
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  playwright-tests:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      # npm ci and the test run share one container so the install survives
      - name: Run Playwright tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0-noble
        run: |
          npm ci
          npx playwright test
          ls -l ${{ cloudbees.workspace }}/results.json

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        if: ${{ always() }}
        with:
          test-type: playwright
          results-path: ${{ cloudbees.workspace }}/results.json

      - name: Register build artifact
        id: build
        uses: cloudbees-io/register-build-artifact@v2
        with:
          name: marvel-mock-e2e
          version: 1.0.0-${{ cloudbees.run_id }}
          url: docker.io/pankajydev/gha-test-image:1.0.0

      - name: Deploy
        kind: deploy
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ steps.build.outputs.artifact-id }}
          target-environment: PANPREPRODTEST
